<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Ilmiah</title>
  <style>
    :root {
      --bg: #e8edf7;
      --panel: #172033;
      --screen: #f8fbff;
      --text: #172033;
      --number: #ffffff;
      --operator: #ff9f43;
      --function: #4e5d78;
      --equal: #7c5cff;
      --danger: #ef476f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: var(--bg);
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
    }

    .calculator {
      width: min(420px, 100%);
      padding: 18px;
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 20px 50px rgba(23, 32, 51, 0.25);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      color: white;
      font-size: 14px;
    }

    .mode {
      border: 0;
      border-radius: 12px;
      padding: 8px 12px;
      background: #293650;
      color: white;
      cursor: pointer;
    }

    .screen {
      min-height: 105px;
      margin-bottom: 12px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--screen);
      text-align: right;
      overflow: hidden;
    }

    .expression {
      min-height: 22px;
      color: #7b8495;
      font-size: 15px;
      word-break: break-all;
    }

    .result {
      min-height: 52px;
      margin-top: 5px;
      font-size: clamp(32px, 10vw, 48px);
      font-weight: 700;
      line-height: 1.05;
      white-space: nowrap;
    }

    .history {
      max-height: 78px;
      margin: 0 0 12px;
      padding: 8px 12px;
      overflow-y: auto;
      border-radius: 12px;
      background: #202b43;
      color: #dce4f5;
      font-size: 13px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    button {
      min-height: 54px;
      border: 0;
      border-radius: 14px;
      background: var(--number);
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.12s ease;
    }

    button:hover { filter: brightness(0.93); }
    button:active { transform: scale(0.96); }

    .function {
      background: var(--function);
      color: white;
      font-size: 14px;
    }

    .operator {
      background: var(--operator);
      color: white;
    }

    .equal {
      grid-column: span 2;
      background: var(--equal);
      color: white;
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    @media (max-width: 430px) {
      body { padding: 8px; }
      .calculator { padding: 12px; border-radius: 18px; }
      .keys { gap: 6px; }
      button { min-height: 50px; }
    }
  </style>
</head>
<body>
  <main class="calculator">
    <div class="topbar">
      <strong>Scientific</strong>
      <button class="mode" id="mode" type="button">DEG</button>
    </div>

    <div class="screen">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="history" id="history"></div>

    <div class="keys">
      <button class="danger" data-action="clear">AC</button>
      <button data-action="backspace">⌫</button>
      <button data-value="(">(</button>
      <button data-value=")">)</button>
      <button class="operator" data-value="/">÷</button>

      <button class="function" data-value="sin(">sin</button>
      <button class="function" data-value="cos(">cos</button>
      <button class="function" data-value="tan(">tan</button>
      <button class="function" data-value="asin(">sin⁻¹</button>
      <button class="function" data-value="acos(">cos⁻¹</button>

      <button class="function" data-value="atan(">tan⁻¹</button>
      <button class="function" data-value="log(">log</button>
      <button class="function" data-value="ln(">ln</button>
      <button class="function" data-value="sqrt(">√</button>
      <button class="function" data-value="^">xʸ</button>

      <button class="function" data-value="!">x!</button>
      <button class="function" data-value="π">π</button>
      <button class="function" data-value="e">e</button>
      <button class="function" data-value="%">%</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="-">−</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>

      <button data-value="3">3</button>
      <button data-value=".">.</button>
      <button data-value="0">0</button>
      <button class="equal" data-action="calculate">=</button>
    </div>
  </main>

  <script>
    const expressionEl = document.getElementById("expression");
    const resultEl = document.getElementById("result");
    const historyEl = document.getElementById("history");
    const modeButton = document.getElementById("mode");
    let expression = "";
    let angleMode = "DEG";

    function append(value) {
      expression += value;
      expressionEl.textContent = formatExpression(expression);
      preview();
    }

    function formatExpression(text) {
      return text
        .replaceAll("*", " × ")
        .replaceAll("/", " ÷ ")
        .replaceAll("-", " − ")
        .replaceAll("π", "π")
        .replaceAll("sqrt(", "√(");
    }

    function factorial(n) {
      n = Number(n);
      if (!Number.isInteger(n) || n < 0) throw new Error("Faktorial hanya untuk bilangan bulat positif");
      if (n > 170) throw new Error("Angka terlalu besar");
      let result = 1;
      for (let i = 2; i <= n; i++) result *= i;
      return result;
    }

    function convertFunctions(input) {
      let output = input
        .replaceAll("π", "Math.PI")
        .replaceAll("e", "Math.E")
        .replaceAll("log(", "Math.log10(")
        .replaceAll("ln(", "Math.log(")
        .replaceAll("sqrt(", "Math.sqrt(")
        .replaceAll("^", "**");

      const trigFunctions = [
        ["sin", "Math.sin"],
        ["cos", "Math.cos"],
        ["tan", "Math.tan"],
        ["asin", "Math.asin"],
        ["acos", "Math.acos"],
        ["atan", "Math.atan"]
      ];

      for (const [name, replacement] of trigFunctions) {
        const regex = new RegExp(name + "\\(([^()]+)\\)", "g");
        output = output.replace(regex, (_, value) => {
          if (angleMode === "DEG") {
            if (name === "sin" || name === "cos" || name === "tan") {
              return replacement + "(" + value + "*Math.PI/180)";
            }
            return "(180/Math.PI*" + replacement + "(" + value + "))";
          }
          if (name === "sin" || name === "cos" || name === "tan") {
            return replacement + "(" + value + ")";
          }
          return replacement + "(" + value + ")";
        });
      }

      return output;
    }

    function expandFactorials(input) {
      let result = input;
      while (result.includes("!")) {
        result = result.replace(/(\d+(?:\.\d+)?)!/g, "factorial($1)");
        if (/!/.test(result) && !/factorial\(/.test(result)) {
          throw new Error("Format faktorial tidak valid");
        }
      }
      return result.replaceAll("factorial", "factorial");
    }

    function calculate() {
      if (!expression) return;
      try {
        let source = convertFunctions(expression);
        source = expandFactorials(source);
        source = source.replace(/(\d+(?:\.\d+)?)%/g, "(($1)/100)");
        source = source.replaceAll("%", "/100");

        if (!/^[0-9+\-*/().MathPIE\s*,]+$/.test(source)) {
          throw new Error("Ekspresi tidak valid");
        }

        const value = Function(
          "factorial",
          "Math",
          `"use strict"; return (${source})`
        )(factorial, Math);

        if (typeof value !== "number" || !Number.isFinite(value)) {
          throw new Error("Hasil tidak valid");
        }

        const formatted = formatNumber(value);
        addHistory(formatExpression(expression), formatted);
        resultEl.textContent = formatted;
        expressionEl.textContent = formatExpression(expression) + " =";
        expression = String(Number(value.toPrecision(15)));
      } catch (error) {
        resultEl.textContent = "Error";
      }
    }

    function preview() {
      if (!expression || /[+\-*/^.(]$/.test(expression)) return;
      try {
        const source = convertFunctions(expression);
        const ready = source.replace(/(\d+(?:\.\d+)?)%/g, "(($1)/100)");
        if (!/^[0-9+\-*/().MathPIE\s*,]+$/.test(ready)) return;
        let value = Function("Math", `"use strict"; return (${ready})`)(Math);
        if (Number.isFinite(value)) resultEl.textContent = formatNumber(value);
      } catch (_) {}
    }

    function formatNumber(value) {
      if (Math.abs(value) >= 1e12 || (Math.abs(value) > 0 && Math.abs(value) < 1e-9)) {
        return value.toExponential(8);
      }
      return String(Number(value.toPrecision(12)));
    }

    function clearAll() {
      expression = "";
      expressionEl.textContent = "";
      resultEl.textContent = "0";
    }

    function backspace() {
      expression = expression.slice(0, -1);
      expressionEl.textContent = formatExpression(expression);
      if (!expression) resultEl.textContent = "0";
      else preview();
    }

    function addHistory(source, result) {
      const item = document.createElement("div");
      item.className = "history-item";
      item.innerHTML = `<span>${escapeHtml(source)}</span><strong>${escapeHtml(result)}</strong>`;
      historyEl.prepend(item);
      while (historyEl.children.length > 8) {
        historyEl.lastElementChild.remove();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    document.querySelectorAll("button").forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.value) append(button.dataset.value);
        if (button.dataset.action === "clear") clearAll();
        if (button.dataset.action === "backspace") backspace();
        if (button.dataset.action === "calculate") calculate();
      });
    });

    modeButton.addEventListener("click", () => {
      angleMode = angleMode === "DEG" ? "RAD" : "DEG";
      modeButton.textContent = angleMode;
    });

    document.addEventListener("keydown", event => {
      if (/^[0-9.+\-*/()!]$/.test(event.key)) {
        event.preventDefault();
        append(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        calculate();
      } else if (event.key === "Backspace") {
        backspace();
      } else if (event.key === "Escape") {
        clearAll();
      }
    });
  </script>
</body>
</html>
